<!-- GitHub Pages отдаёт эту страницу и для вложенных адресов, поэтому задаём базу для относительных путей:
     на user.github.io/repo/ это /repo/, на своём домене или локально это / -->
<script>
(function () {
  var base = '/';
  if (/\.github\.io$/.test(location.hostname)) {
    var seg = location.pathname.split('/')[1];
    if (seg) base = '/' + seg + '/';
  }
  document.write('<base href="' + base + '">');
})();
</script>
